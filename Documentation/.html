<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen workspace. Top bar (title + module tabs), pan/zoom canvas below,
   floating zoom controls, detail drawer for the selected table. Color = module. */
:root {
  --bg: #eceff3;
  --dot: #d3d9e1;
  --surface: #ffffff;
  --fg: #182032;
  --muted: #5f6b7e;
  --line: #d2d8e0;
  --hover: #f3f5f8;
  --shadow: 0 1px 2px rgba(24,32,50,.07), 0 6px 18px rgba(24,32,50,.07);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;

  /* module colors: mid-tone so white header text reads, and they hold on both grounds */
  --m-inti: #3d4a5e;
  --m-akses: #6a40cf;
  --m-anggota: #0d7a63;
  --m-program: #c2410c;
  --m-presensi: #be123c;
  --m-keuangan: #2e7d32;
  --m-inventaris: #94650a;
  --m-surat: #1d5bd8;
  --m-evoting: #a21caf;
  --m-lomba: #8a4b2a;
  --m-info: #0b7f9c;
  --m-kalender: #3730a3;
  --m-evaluasi: #5c6b10;
  --m-panitia: #c0265f;
  --m-sponsor: #0f6fa8;
  --m-pengadaan: #6b5a4a;
  --m-danus: #b4530f;
  --m-sistem: #475b78;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141b; --dot: #222a36; --surface: #19202a; --fg: #e5e9f0; --muted: #8e99ab;
    --line: #2c3542; --hover: #212a36;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141b; --dot: #222a36; --surface: #19202a; --fg: #e5e9f0; --muted: #8e99ab;
  --line: #2c3542; --hover: #212a36;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px;
  display: flex; flex-direction: column; overflow: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--m-surat); outline-offset: 2px; }

.bar {
  display: flex; flex-direction: column; gap: 10px;
  padding: 14px 16px 10px; background: var(--surface); border-bottom: 1px solid var(--line);
  position: relative; z-index: 3;
}
.bar-top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.bar h1 { font-family: var(--display); font-weight: 700; font-size: 20px; margin: 0; letter-spacing: -.01em; }
.bar .meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.bar .opts { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 4px 10px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--surface); }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); cursor: pointer; }

.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
.tab {
  flex: none; display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 5px 11px 5px 9px; font-size: 13px; cursor: pointer; white-space: nowrap;
}
.tab:hover { background: var(--hover); }
.tab .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--c, var(--fg)); }
.tab .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.tab[aria-selected="true"] { background: var(--c, var(--fg)); border-color: var(--c, var(--fg)); color: #fff; }
.tab[aria-selected="true"] .n { color: rgba(255,255,255,.8); }
.tab[aria-selected="true"] .sw { background: #fff; }
.tab.all[aria-selected="true"] { color: var(--surface); }
.tab.all[aria-selected="true"] .n { color: var(--surface); opacity: .75; }

.stage { position: relative; flex: 1; min-height: 0; }
#canvas {
  width: 100%; height: 100%; display: block; touch-action: none; cursor: grab;
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1px, transparent 1.2px);
  background-size: 22px 22px;
}
#canvas.dragging { cursor: grabbing; }

.zoom {
  position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line);
  border-radius: 9px; box-shadow: var(--shadow); overflow: hidden;
}
.zoom button { border: 0; background: transparent; width: 36px; height: 34px; cursor: pointer; font-size: 16px; }
.zoom button + button { border-top: 1px solid var(--line); }
.zoom button:hover { background: var(--hover); }
.zoom .fit { font-size: 11px; font-weight: 600; letter-spacing: .04em; }

.hint {
  position: absolute; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; max-width: calc(100% - 100px);
}
.status {
  position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px;
  pointer-events: none;
}

/* detail drawer */
.panel {
  position: absolute; top: 12px; right: 12px; bottom: 12px; width: min(340px, calc(100% - 24px));
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden; z-index: 2;
}
.panel-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
.panel-head .t { min-width: 0; flex: 1; }
.panel-head h2 { margin: 0; font-family: var(--mono); font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.panel-head .mod { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.panel-head .mod i { width: 9px; height: 9px; border-radius: 2px; background: var(--c); }
.panel-head .close { border: 0; background: transparent; cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px; color: var(--muted); border-radius: 6px; }
.panel-head .close:hover { background: var(--hover); }
.panel-body { overflow-y: auto; padding: 6px 16px 16px; }
.panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
.cols { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
.cols td { padding: 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.cols td.ty { color: var(--muted); text-align: right; padding-left: 8px; white-space: nowrap; }
.cols .k { display: inline-block; font-size: 9.5px; font-weight: 600; padding: 0 4px; border-radius: 3px; margin-right: 5px; border: 1px solid currentColor; color: var(--muted); }
.cols .k.pk { color: var(--c); }
.cols .nn { color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.links button {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 6px; padding: 3px 8px; font-family: var(--mono); font-size: 12px; cursor: pointer;
}
.links button:hover { background: var(--hover); }
.links button i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.links .via { color: var(--muted); }
.empty { color: var(--muted); font-size: 13px; }

.desc { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; max-width: 90ch; }
.about-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; }
.about-btn:hover { background: var(--hover); }
.about p { margin: 0 0 10px; font-size: 13px; line-height: 1.55; }
.about ol, .about ul { margin: 0 0 10px; padding-left: 18px; font-size: 13px; line-height: 1.55; }
.about li + li { margin-top: 4px; }
.about .mods { display: grid; gap: 6px; }
.about .mods button {
  display: grid; grid-template-columns: 10px 1fr; gap: 4px 8px; align-items: baseline; text-align: left;
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; cursor: pointer;
}
.about .mods button:hover { background: var(--hover); }
.about .mods i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.about .mods b { font-size: 13px; font-weight: 600; }
.about .mods span { grid-column: 2; color: var(--muted); font-size: 12px; line-height: 1.4; }

/* svg */
.tbl { cursor: pointer; }
.tbl .body { fill: var(--surface); stroke: var(--line); }
.tbl.ghost .body { stroke-dasharray: 4 3; }
.tbl .hd-text { fill: #fff; font-family: var(--mono); font-weight: 600; font-size: 12.5px; }
.tbl .cn { fill: var(--fg); font-family: var(--mono); font-size: 12px; }
.tbl .cn.pk { font-weight: 600; }
.tbl .ct { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
.tbl .badge { font-family: var(--mono); font-size: 9px; font-weight: 600; }
.tbl .sep { stroke: var(--line); }
.tbl .more { fill: var(--muted); font-family: var(--sans); font-size: 11px; font-style: italic; }
.tbl .hl-row { fill: var(--hover); }
.edge path { fill: none; stroke-width: 1.4; stroke-opacity: .55; }
.edge .mark { fill: none; stroke-width: 1.4; stroke-opacity: .7; }
.grp-box { stroke-width: 1.2; }
.grp-label { font-family: var(--display); font-weight: 700; font-size: 18px; fill: var(--fg); }
.grp-count { font-family: var(--sans); font-size: 12px; fill: var(--muted); }

svg.focus .tbl:not(.hl) { opacity: .22; }
svg.focus .edge:not(.hl) { opacity: .08; }
svg.focus .edge.hl path { stroke-opacity: 1; stroke-width: 2.2; }
svg.focus .edge.hl .mark { stroke-opacity: 1; stroke-width: 2; }
.tbl.sel .body { stroke: var(--fg); stroke-width: 2; }
.tbl, .edge { transition: opacity .15s; }
@media (prefers-reduced-motion: reduce) { .tbl, .edge { transition: none; } }

/* export mode (local PNG rendering only) */
body.export .bar, body.export .zoom, body.export .hint, body.export .panel { display: none !important; }
body.export { overflow: visible; height: auto; }
body.export #canvas { background-image: none; }

@media (max-width: 640px) {
  .bar h1 { font-size: 18px; }
  .bar .opts { margin-left: 0; width: 100%; }
  .hint { display: none; }
  .panel { top: auto; height: 55%; left: 12px; width: auto; }
}
</style>

<header class="bar">
  <div class="bar-top">
    <h1>ClubSphere</h1>
    <span class="meta" id="meta">MySQL · clubsphere</span>
    <div class="opts">
      <div class="seg" role="group" aria-label="Kolom yang ditampilkan">
        <button id="colsKeys" type="button" aria-pressed="false">Kunci saja</button>
        <button id="colsAll" type="button" aria-pressed="true">Semua kolom</button>
      </div>
      <label class="check"><input id="audit" type="checkbox"> Kolom audit</label>
      <button type="button" class="about-btn" id="aboutBtn">Tentang sistem</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Modul"></nav>
  <p class="desc" id="desc"></p>
</header>

<main class="stage">
  <svg id="canvas" role="img" aria-label="Diagram relasi tabel database clubsphere">
    <defs></defs>
    <g id="vp"></g>
  </svg>
  <div class="status" id="status">Menyusun tata letak…</div>
  <div class="hint" id="hint">Geser untuk memindah, scroll untuk zoom. Klik tabel untuk melihat relasinya.</div>
  <div class="zoom">
    <button type="button" id="zin" aria-label="Perbesar">+</button>
    <button type="button" id="zout" aria-label="Perkecil">−</button>
    <button type="button" id="zfit" class="fit" aria-label="Tampilkan seluruh diagram">FIT</button>
  </div>
  <aside class="panel" id="panel" hidden></aside>
</main>

const AUDIT = new Set(["ins_date","ins_by","upd_date","upd_by"]);

// ---------- model ----------
const modOf = {};
MODULES.forEach(m => m.tables.forEach(t => modOf[t] = m.id));
const modById = Object.fromEntries(MODULES.map(m => [m.id, m]));
const tables = {};
for (const [name, cols] of Object.entries(SCHEMA.tables)) {
  cols.sort((a, b) => a[0] - b[0]);
  tables[name] = {
    name,
    mod: modOf[name] || "inti",
    cols: cols.map(c => ({ name: c[1], type: c[2], pk: !!c[3], nullable: !!c[4], uq: !!c[5], fk: null })),
  };
}
const fks = SCHEMA.fks.map(([t, c, rt, rc]) => ({ child: t, col: c, parent: rt, pcol: rc }));
for (const f of fks) {
  const col = tables[f.child].cols.find(c => c.name === f.col);
  if (col) col.fk = f.parent;
}
const colorOf = id => `var(--m-${id})`;

// ---------- measuring ----------
const mctx = document.createElement("canvas").getContext("2d");
function tw(text, font) { mctx.font = font; return mctx.measureText(text).width; }
const F_HEAD = '600 12.5px "JetBrains Mono", Consolas, monospace';
const F_COL = '400 12px "JetBrains Mono", Consolas, monospace';
const F_TYPE = '400 11px "JetBrains Mono", Consolas, monospace';
const HEAD_H = 30, ROW_H = 21, PAD = 10, BADGE_W = 22, MORE_H = 20;

// ---------- state ----------
const state = { view: "presensi", cols: "all", audit: false, sel: null, colsTouched: false };
try {
  const saved = localStorage.getItem("erd-view");
  if (saved && (saved === "all" || modById[saved])) state.view = saved;
} catch (e) {}
const hash = (location.hash || "").slice(1);
if (hash === "all" || modById[hash]) state.view = hash;

const params = new URLSearchParams(location.search);
const EXPORT = params.get("export");
if (EXPORT) {
  document.body.classList.add("export");
  state.view = EXPORT;
  state.cols = params.get("cols") || (EXPORT === "all" ? "keys" : "all");
  state.colsTouched = true;
}

// ---------- tabs ----------
const tabsEl = document.getElementById("tabs");
function renderTabs() {
  const items = [{ id: "all", name: "Semua modul", n: Object.keys(tables).length }]
    .concat(MODULES.map(m => ({ id: m.id, name: m.name, n: m.tables.length })));
  tabsEl.innerHTML = items.map(it => `
    <button type="button" role="tab" class="tab ${it.id === "all" ? "all" : ""}" data-v="${it.id}"
      aria-selected="${state.view === it.id}" style="${it.id === "all" ? "" : `--c:${colorOf(it.id)}`}">
      <span class="sw"></span>${it.name}<span class="n">${it.n}</span>
    </button>`).join("");
}
tabsEl.addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  setView(b.dataset.v);
});
function setView(v, selectTable) {
  state.view = v;
  if (!state.colsTouched) state.cols = v === "all" ? "keys" : "all";
  state.sel = selectTable || null;
  try { localStorage.setItem("erd-view", v); } catch (e) {}
  renderTabs();
  const active = tabsEl.querySelector('[aria-selected="true"]');
  if (active) active.scrollIntoView({ block: "nearest", inline: "nearest" });
  draw();
}

// ---------- column options ----------
const bKeys = document.getElementById("colsKeys"), bAll = document.getElementById("colsAll"), cAudit = document.getElementById("audit");
function syncOpts() {
  bKeys.setAttribute("aria-pressed", state.cols === "keys");
  bAll.setAttribute("aria-pressed", state.cols === "all");
  cAudit.checked = state.audit;
  cAudit.disabled = state.cols === "keys";
}
bKeys.onclick = () => { state.cols = "keys"; state.colsTouched = true; draw(); };
bAll.onclick = () => { state.cols = "all"; state.colsTouched = true; draw(); };
cAudit.onchange = () => { state.audit = cAudit.checked; draw(); };

function typeLabel(t, c) {
  if (state.view === "all" && c.fk && tables[c.fk].mod !== t.mod) return "→ " + c.fk;
  return c.type;
}
function visibleCols(t, ghost) {
  if (ghost) return t.cols.filter(c => c.pk);
  if (state.cols === "keys") return t.cols.filter(c => c.pk || c.fk || c.uq);
  return t.cols.filter(c => state.audit || !AUDIT.has(c.name));
}

// ---------- build graph ----------
function buildGraph() {
  const view = state.view;
  let inView, ghosts = new Set();
  if (view === "all") inView = new Set(Object.keys(tables));
  else {
    inView = new Set(modById[view].tables);
    for (const f of fks) if (inView.has(f.child) && !inView.has(f.parent)) ghosts.add(f.parent);
  }
  const shown = new Set([...inView, ...ghosts]);
  const nodes = {}, elkNodes = [];
  for (const name of shown) {
    const t = tables[name], ghost = ghosts.has(name);
    const cols = visibleCols(t, ghost);
    const hidden = t.cols.length - cols.length;
    let w = tw(name, F_HEAD) + PAD * 2 + 4;
    for (const c of cols) w = Math.max(w, PAD + BADGE_W + tw(c.name, F_COL) + 18 + tw(typeLabel(t, c), F_TYPE) + PAD);
    w = Math.ceil(Math.max(w, 170));
    const more = hidden > 0 ? MORE_H : 0;
    const h = HEAD_H + cols.length * ROW_H + more + 4;
    const ports = [];
    cols.forEach((c, i) => {
      const y = HEAD_H + i * ROW_H + ROW_H / 2;
      if (c.pk) ports.push({ id: `${name}::${c.name}::out`, x: w, y, width: 0, height: 0, layoutOptions: { "elk.port.side": "EAST" } });
      if (c.fk) ports.push({ id: `${name}::${c.name}::in`, x: 0, y, width: 0, height: 0, layoutOptions: { "elk.port.side": "WEST" } });
    });
    nodes[name] = { t, ghost, cols, hidden, w, h };
    elkNodes.push({ id: name, width: w, height: h, ports, layoutOptions: { "elk.portConstraints": "FIXED_POS" } });
  }
  const edges = [];
  for (const f of fks) {
    if (!shown.has(f.child) || !shown.has(f.parent)) continue;
    if (!inView.has(f.child)) continue; // ghosts only show what this module points at
    if (view === "all" && tables[f.child].mod !== tables[f.parent].mod) continue;
    const src = `${f.parent}::${f.pcol}::out`, dst = `${f.child}::${f.col}::in`;
    const srcVisible = nodes[f.parent].cols.some(c => c.name === f.pcol);
    const dstVisible = nodes[f.child].cols.some(c => c.name === f.col);
    if (!srcVisible || !dstVisible) continue;
    edges.push({ id: `e${edges.length}`, sources: [src], targets: [dst], f });
  }
  const elkEdge = e => ({ id: e.id, sources: e.sources, targets: e.targets });
  let children = elkNodes, rootEdges = edges.map(elkEdge);
  const layered = {
    "elk.algorithm": "layered",
    "elk.direction": "RIGHT",
    "elk.edgeRouting": "ORTHOGONAL",
    "elk.layered.spacing.nodeNodeBetweenLayers": "70",
    "elk.spacing.nodeNode": "28",
    "elk.layered.spacing.edgeNodeBetweenLayers": "18",
    "elk.spacing.edgeEdge": "8",
    "elk.layered.nodePlacement.strategy": "NETWORK_SIMPLEX",
    "elk.layered.crossingMinimization.strategy": "LAYER_SWEEP",
    "elk.layered.considerModelOrder.strategy": "NODES_AND_EDGES",
  };
  let rootOpts = { ...layered, "elk.padding": "[top=30,left=30,bottom=30,right=30]" };
  if (view === "all") {
    // overview: each module laid out on its own, then the modules are packed like tiles.
    // Cross-module links are written as "→ table" on the FK row instead of drawn.
    children = MODULES.map(m => ({
      id: `grp:${m.id}`,
      layoutOptions: { ...layered, "elk.padding": "[top=58,left=24,bottom=24,right=24]" },
      children: elkNodes.filter(n => tables[n.id].mod === m.id),
      edges: edges.filter(e => tables[e.f.child].mod === m.id).map(elkEdge),
    }));
    rootEdges = [];
    rootOpts = { "elk.algorithm": "rectpacking", "elk.aspectRatio": "1.9",
      "elk.spacing.nodeNode": "36", "elk.padding": "[top=30,left=30,bottom=30,right=30]" };
  }
  return { nodes, edges, elk: { id: "root", layoutOptions: rootOpts, children, edges: rootEdges } };
}

// ---------- render ----------
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("canvas"), vp = document.getElementById("vp");
const statusEl = document.getElementById("status");
const elk = new ELK();
let current = null, drawSeq = 0;

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function text(parent, x, y, str, cls, extra = {}) {
  const t = el("text", { x, y, class: cls, ...extra }, parent);
  t.textContent = str; return t;
}
function roundedPath(pts, r = 7) {
  let d = `M${pts[0].x},${pts[0].y}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
    const d1 = Math.hypot(p1.x - p0.x, p1.y - p0.y), d2 = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    const rr = Math.min(r, d1 / 2, d2 / 2);
    const a = { x: p1.x - (p1.x - p0.x) / d1 * rr, y: p1.y - (p1.y - p0.y) / d1 * rr };
    const b = { x: p1.x + (p2.x - p1.x) / d2 * rr, y: p1.y + (p2.y - p1.y) / d2 * rr };
    d += ` L${a.x},${a.y} Q${p1.x},${p1.y} ${b.x},${b.y}`;
  }
  const last = pts[pts.length - 1];
  return d + ` L${last.x},${last.y}`;
}

async function draw() {
  const seq = ++drawSeq;
  syncOpts();
  renderMeta();
  statusEl.hidden = false;
  const g = buildGraph();
  let res;
  try { res = await elk.layout(g.elk); }
  catch (err) { statusEl.textContent = "Tata letak gagal: " + err.message; return; }
  if (seq !== drawSeq) return;
  statusEl.hidden = true;
  vp.textContent = "";
  const gGroups = el("g", {}, vp), gEdges = el("g", {}, vp), gNodes = el("g", {}, vp);
  const pos = {};
  const edgeOff = {};
  const walk = (n, ox, oy) => {
    for (const e of n.edges || []) edgeOff[e.id] = { e, ox, oy };
    for (const c of n.children || []) {
      const x = ox + c.x, y = oy + c.y;
      if (c.id.startsWith("grp:")) {
        const id = c.id.slice(4), m = modById[id];
        const box = el("rect", { x, y, width: c.width, height: c.height, rx: 14, class: "grp-box",
          style: `fill:color-mix(in srgb, ${colorOf(id)} 7%, transparent);stroke:color-mix(in srgb, ${colorOf(id)} 45%, transparent)` }, gGroups);
        el("rect", { x: x + 20, y: y + 20, width: 12, height: 12, rx: 3, style: `fill:${colorOf(id)}` }, gGroups);
        const lbl = text(gGroups, x + 40, y + 32, m.name, "grp-label");
        text(gGroups, x + 46 + tw(m.name, '700 18px "Bricolage Grotesque", sans-serif'), y + 32, `${m.tables.length} tabel`, "grp-count");
        walk(c, x, y);
      } else pos[c.id] = { x, y };
    }
  };
  walk(res, 0, 0);

  // edges
  const edgeEls = [];
  for (const e of g.edges) {
    const hit = edgeOff[e.id]; if (!hit || !hit.e.sections) continue;
    const s = hit.e.sections[0];
    const pts = [s.startPoint, ...(s.bendPoints || []), s.endPoint].map(p => ({ x: p.x + hit.ox, y: p.y + hit.oy }));
    const col = colorOf(tables[e.f.parent].mod);
    const ge = el("g", { class: "edge", style: `stroke:${col}` }, gEdges);
    el("path", { d: roundedPath(pts) }, ge);
    const sp = pts[0], ep = pts[pts.length - 1];
    const sdir = Math.sign((pts[1].x - sp.x) || 1), edir = Math.sign((ep.x - pts[pts.length - 2].x) || 1);
    // "one" bar at the parent key, crow's foot ("many") at the child FK
    el("path", { class: "mark", d: `M${sp.x + sdir * 7},${sp.y - 5} V${sp.y + 5}` }, ge);
    const bx = ep.x - edir * 10;
    el("path", { class: "mark", d: `M${bx},${ep.y} L${ep.x},${ep.y - 5} M${bx},${ep.y} L${ep.x},${ep.y} M${bx},${ep.y} L${ep.x},${ep.y + 5}` }, ge);
    ge._f = e.f;
    edgeEls.push(ge);
  }

  // nodes
  const nodeEls = {};
  for (const [name, n] of Object.entries(g.nodes)) {
    const p = pos[name]; if (!p) continue;
    const col = colorOf(n.t.mod);
    const gn = el("g", { class: "tbl" + (n.ghost ? " ghost" : ""), transform: `translate(${p.x},${p.y})`, tabindex: 0,
      role: "button", "aria-label": `Tabel ${name}` }, gNodes);
    gn.dataset.t = name;
    el("rect", { class: "body", width: n.w, height: n.h, rx: 8 }, gn);
    el("path", { d: `M0,8 a8,8 0 0 1 8,-8 h${n.w - 16} a8,8 0 0 1 8,8 v${HEAD_H - 8} h${-n.w} z`,
      style: `fill:${col};${n.ghost ? "opacity:.72" : ""}` }, gn);
    text(gn, PAD, 19.5, name, "hd-text");
    n.cols.forEach((c, i) => {
      const y = HEAD_H + i * ROW_H;
      if (i > 0) el("line", { class: "sep", x1: 0, x2: n.w, y1: y + .5, y2: y + .5 }, gn);
      const k = c.pk ? "PK" : c.fk ? "FK" : c.uq ? "UQ" : "";
      if (k) text(gn, PAD, y + 14.5, k, "badge", { style: `fill:${c.pk ? col : "var(--muted)"}` });
      text(gn, PAD + BADGE_W, y + 14.5, c.name, "cn" + (c.pk ? " pk" : ""));
      const ext = typeLabel(n.t, c) !== c.type;
      text(gn, n.w - PAD, y + 14.5, typeLabel(n.t, c), "ct", { "text-anchor": "end", style: ext ? `fill:${colorOf(tables[c.fk].mod)};font-weight:500` : "" });
    });
    if (n.hidden) {
      const y = HEAD_H + n.cols.length * ROW_H;
      el("line", { class: "sep", x1: 0, x2: n.w, y1: y + .5, y2: y + .5 }, gn);
      text(gn, PAD + BADGE_W, y + 14, n.ghost ? "modul lain" : state.cols === "all" && !state.audit ? `+${n.hidden} kolom audit` : `+${n.hidden} kolom lain`, "more");
    }
    nodeEls[name] = gn;
  }
  current = { g, res, edgeEls, nodeEls, w: res.width, h: res.height };
  if (EXPORT) return exportReady();
  fit();
  if (state.sel && nodeEls[state.sel]) select(state.sel, true);
  else closePanel();
}

const SYSTEM_DESC = "Sistem manajemen UKM / organisasi mahasiswa, multi-tenant dan multi-kampus. Pilih modul untuk melihat tabelnya, atau buka Tentang sistem.";
function renderMeta() {
  document.getElementById("desc").textContent = state.view === "all" ? SYSTEM_DESC : modById[state.view].desc;
  const meta = document.getElementById("meta");
  if (state.view === "all") meta.textContent = `${Object.keys(tables).length} tabel · ${fks.length} relasi · ${MODULES.length} modul · relasi antar-modul ditulis sebagai → tabel`;
  else {
    const m = modById[state.view];
    const n = fks.filter(f => m.tables.includes(f.child)).length;
    meta.textContent = `${m.name} · ${m.tables.length} tabel · ${n} relasi keluar`;
  }
}

// ---------- focus / selection ----------
function related(name) {
  const set = new Set([name]);
  for (const e of current.edgeEls) if (e._f.child === name || e._f.parent === name) { set.add(e._f.child); set.add(e._f.parent); }
  return set;
}
function focus(name) {
  if (!current) return;
  if (!name) { svg.classList.remove("focus"); return; }
  const rel = related(name);
  svg.classList.add("focus");
  for (const [n, gEl] of Object.entries(current.nodeEls)) gEl.classList.toggle("hl", rel.has(n));
  for (const e of current.edgeEls) e.classList.toggle("hl", e._f.child === name || e._f.parent === name);
}
let hoverName = null;
svg.addEventListener("pointerover", e => {
  const t = e.target.closest(".tbl"); if (!t || state.sel) return;
  hoverName = t.dataset.t; focus(hoverName);
});
svg.addEventListener("pointerout", e => {
  const t = e.target.closest(".tbl"); if (!t || state.sel) return;
  if (!e.relatedTarget || !t.contains(e.relatedTarget)) { hoverName = null; focus(null); }
});

const panel = document.getElementById("panel");
function select(name, centerIt) {
  state.sel = name;
  for (const gEl of Object.values(current.nodeEls)) gEl.classList.toggle("sel", gEl.dataset.t === name);
  focus(name);
  const t = tables[name], m = modById[t.mod];
  const out = fks.filter(f => f.child === name), inc = fks.filter(f => f.parent === name);
  const link = (tn, via) => `<button type="button" data-go="${tn}" style="--c:${colorOf(tables[tn].mod)}"><i></i>${tn}${via ? ` <span class="via">${via}</span>` : ""}</button>`;
  panel.style.setProperty("--c", colorOf(t.mod));
  panel.innerHTML = `
    <div class="panel-head">
      <div class="t"><h2>${name}</h2><div class="mod"><i></i>${m.name}</div></div>
      <button type="button" class="close" aria-label="Tutup">×</button>
    </div>
    <div class="panel-body">
      <h3>${t.cols.length} kolom</h3>
      <table class="cols"><tbody>${t.cols.map(c => `
        <tr><td>${c.pk ? '<span class="k pk">PK</span>' : c.fk ? '<span class="k">FK</span>' : c.uq ? '<span class="k">UQ</span>' : ""}${c.name}</td>
        <td class="ty">${c.type}${c.nullable ? "" : ' <span class="nn">·NN</span>'}</td></tr>`).join("")}
      </tbody></table>
      <h3>Mengacu ke (${out.length})</h3>
      ${out.length ? `<div class="links">${out.map(f => link(f.parent, "via " + f.col)).join("")}</div>` : '<p class="empty">Tidak punya foreign key.</p>'}
      <h3>Diacu oleh (${inc.length})</h3>
      ${inc.length ? `<div class="links">${inc.map(f => link(f.child, f.col)).join("")}</div>` : '<p class="empty">Belum ada tabel yang mengacu ke sini.</p>'}
    </div>`;
  panel.hidden = false;
  panel.querySelector(".close").onclick = () => clearSel();
  if (centerIt) centerOn(name);
}
function showAbout() {
  if (state.sel) clearSel();
  panel.style.removeProperty("--c");
  panel.innerHTML = `
    <div class="panel-head">
      <div class="t"><h2 style="font-family:var(--display);font-size:18px">Tentang ClubSphere</h2></div>
      <button type="button" class="close" aria-label="Tutup">×</button>
    </div>
    <div class="panel-body about">
      <h3>Apa ini</h3>
      <p>Sistem informasi untuk mengelola UKM / organisasi mahasiswa di satu atau banyak kampus: landing page publik, dashboard admin kampus, dashboard pengurus UKM, dan portal anggota.</p>
      <h3>Struktur</h3>
      <p>Tenant → Kampus → Organisasi → Periode kepengurusan. Anggota, aset, akun keuangan, dan dokumen menempel ke organisasi sehingga tetap ada saat pengurus berganti. Pengurus, program, anggaran, surat, dan pemilihan menempel ke periode.</p>
      <h3>Pengguna</h3>
      <ul>
        <li><b>Administrator / pegawai</b> (m_staff): kelola kampus, UKM, akun, fasilitas, moderasi landing page.</li>
        <li><b>Pembina</b> (m_staff, ditetapkan Kepala BAKPK): satu pembina per UKM, boleh membina beberapa UKM; menyetujui proposal dan pengadaan.</li>
        <li><b>Pengurus UKM</b>: role per organisasi dan periode. Role dari periode yang sudah ditutup hanya boleh membaca.</li>
        <li><b>Anggota</b> (m_member): presensi, iuran, peminjaman, voting.</li>
        <li><b>Pengunjung</b>: landing page dan pendaftaran recruitment.</li>
      </ul>
      <h3>Alur penting</h3>
      <ol>
        <li><b>Ganti pengurus:</b> serah terima (saldo, aset, program, piutang, hutang, LPJ), lalu periode ditutup. Saldo akhir dikunci dan menjadi saldo awal periode baru.</li>
        <li><b>Presensi:</b> scan QR, foto wajib, lokasi dicek terhadap radius. Lewat 10 menit dari jam mulai = terlambat.</li>
        <li><b>Landing page:</b> konten UKM menunggu persetujuan admin kampus sebelum tampil.</li>
        <li><b>E-voting:</b> suara terenkripsi tanpa jejak pemilih, didekripsi hanya saat finalisasi.</li>
      </ol>
      <h3>Konvensi database</h3>
      <ul>
        <li>m_* = master, t_* = transaksi. Status/tipe berupa angka, artinya di COMMENT kolom.</li>
        <li>Tanpa AUTO_INCREMENT: ID diambil dari m_sequence (kecuali id suara, dibuat acak).</li>
        <li>Semua file disimpan sebagai blob dan dikompres oleh aplikasi.</li>
      </ul>
      <h3>${MODULES.length} modul</h3>
      <div class="mods">${MODULES.map(m => `<button type="button" data-mod="${m.id}" style="--c:${colorOf(m.id)}"><i></i><b>${m.name} · ${m.tables.length} tabel</b><span>${m.desc}</span></button>`).join("")}</div>
    </div>`;
  panel.hidden = false;
  panel.querySelector(".close").onclick = () => closePanel();
  panel.querySelector(".panel-body").scrollTop = 0;
}
document.getElementById("aboutBtn").onclick = showAbout;
function clearSel() {
  state.sel = null;
  if (current) for (const gEl of Object.values(current.nodeEls)) gEl.classList.remove("sel");
  focus(null); closePanel();
}
function closePanel() { panel.hidden = true; }
panel.addEventListener("click", e => {
  const mb = e.target.closest("[data-mod]");
  if (mb) { closePanel(); setView(mb.dataset.mod); return; }
  const b = e.target.closest("[data-go]"); if (!b) return;
  const tn = b.dataset.go;
  if (current.nodeEls[tn] && !current.g.nodes[tn].ghost) select(tn, true);
  else setView(state.view === "all" ? "all" : tables[tn].mod, tn);
});

// ---------- pan / zoom ----------
const tf = { x: 0, y: 0, k: 1 };
function apply() { vp.setAttribute("transform", `translate(${tf.x},${tf.y}) scale(${tf.k})`); }
function fit() {
  if (!current) return;
  const r = svg.getBoundingClientRect();
  const padR = panel.hidden || r.width < 640 ? 0 : 352;
  const k = Math.min((r.width - padR - 32) / current.w, (r.height - 32) / current.h, 1.25);
  tf.k = Math.max(k, 0.05);
  tf.x = (r.width - padR - current.w * tf.k) / 2;
  tf.y = (r.height - current.h * tf.k) / 2;
  apply();
}
function centerOn(name) {
  const gEl = current.nodeEls[name]; if (!gEl) return;
  const n = current.g.nodes[name];
  const m = /translate\(([-\d.]+),([-\d.]+)\)/.exec(gEl.getAttribute("transform"));
  const cx = +m[1] + n.w / 2, cy = +m[2] + n.h / 2;
  const r = svg.getBoundingClientRect();
  const visW = r.width < 640 ? r.width : r.width - 352, visH = r.width < 640 ? r.height * .45 : r.height;
  if (tf.k < .7) tf.k = .9;
  tf.x = visW / 2 - cx * tf.k; tf.y = visH / 2 - cy * tf.k; apply();
}
function zoomAt(f, cx, cy) {
  const k = Math.min(3, Math.max(0.05, tf.k * f));
  tf.x = cx - (cx - tf.x) * (k / tf.k); tf.y = cy - (cy - tf.y) * (k / tf.k); tf.k = k; apply();
}
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
const pointers = new Map(); let drag = null, pinch = null;
svg.addEventListener("pointerdown", e => {
  svg.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, tx: tf.x, ty: tf.y, moved: false, target: e.target.closest(".tbl") };
  else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: tf.k }; drag = null;
  }
});
svg.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2) {
    const [a, b] = [...pointers.values()], r = svg.getBoundingClientRect();
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt((pinch.k * d / pinch.d) / tf.k, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
  } else if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) { drag.moved = true; svg.classList.add("dragging"); }
    if (drag.moved) { tf.x = drag.tx + dx; tf.y = drag.ty + dy; apply(); }
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (drag && pointers.size === 0) {
    svg.classList.remove("dragging");
    if (!drag.moved) {
      if (drag.target) select(drag.target.dataset.t);
      else clearSel();
    }
    drag = null;
  }
}
svg.addEventListener("pointerup", endPointer);
svg.addEventListener("pointercancel", endPointer);
svg.addEventListener("keydown", e => {
  const t = e.target.closest && e.target.closest(".tbl");
  if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(t.dataset.t, true); }
  if (e.key === "Escape") clearSel();
});
document.getElementById("zin").onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(1.25, r.width / 2, r.height / 2); };
document.getElementById("zout").onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(0.8, r.width / 2, r.height / 2); };
document.getElementById("zfit").onclick = fit;
window.addEventListener("resize", () => current && fit());

// ---------- export (local only) ----------
function exportReady() {
  const W = Math.ceil(current.w), H = Math.ceil(current.h);
  document.documentElement.style.background = getComputedStyle(document.body).backgroundColor;
  document.body.style.width = W + "px"; document.body.style.height = H + "px";
  svg.style.width = W + "px"; svg.style.height = H + "px";
  tf.x = 0; tf.y = 0; tf.k = 1; apply();
  statusEl.hidden = true;
  document.title = `READY ${W}x${H}`;
}

// ---------- boot ----------
renderTabs();
(document.fonts ? Promise.all([
  document.fonts.load(F_HEAD), document.fonts.load(F_COL), document.fonts.load(F_TYPE),
  document.fonts.load('700 18px "Bricolage Grotesque"'),
]).catch(() => {}) : Promise.resolve()).then(() => draw());
</script>
